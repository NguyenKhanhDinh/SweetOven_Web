plugins {
    id 'java'
    id 'war'
}

group = 'com.sweetoven'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    // Jakarta Servlet API (Tomcat 10+)
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    providedCompile 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'

    // JSTL
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Google API Client
    implementation 'com.google.api-client:google-api-client:2.2.0'

    // JDBI
    implementation 'org.jdbi:jdbi3-core:3.45.0'
    implementation 'org.jdbi:jdbi3-sqlobject:3.45.0'

    // MySQL
    implementation 'com.mysql:mysql-connector-j:9.5.0'

    // Log4j2
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'

    // Email
    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    // Cloudinary
    implementation 'com.cloudinary:cloudinary-http44:1.38.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.10.1'

    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.2'
}

war {
    archiveFileName = 'TTLTW.war'
}

test {
    useJUnitPlatform()
}